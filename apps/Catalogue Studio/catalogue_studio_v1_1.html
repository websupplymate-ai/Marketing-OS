<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Catalogue Studio V2 — demo</title>
<style>/* Catalogue Studio V2 — one stylesheet, no framework.
   Dark-first because operators run this next to image previews all day. */

:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --panel: #14181d;
  --panel-2: #1b2027;
  --line: #262d36;
  --text: #e8edf3;
  --muted: #93a0b0;
  --accent: #5b9dff;
  --accent-soft: rgba(91, 157, 255, 0.14);
  --ok: #46c08a;
  --warn: #e5b567;
  --bad: #e5736b;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}

/* ---------- shell ---------- */

.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 232px;
  flex: 0 0 232px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  font-weight: 650;
  font-size: 15px;
  letter-spacing: -0.01em;
  padding: 0 10px 14px;
}
.brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: none;
  font: inherit;
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--panel-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
.nav-item .step { font-family: var(--mono); font-size: 11px; opacity: 0.65; }

.main { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1400px; }

.page-head { margin-bottom: 22px; }
.page-head h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.02em; font-weight: 620; }
.page-head p { margin: 0; color: var(--muted); max-width: 68ch; }

/* ---------- primitives ---------- */

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
}
.panel h2 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
.panel .hint { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }

.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }

input[type="text"], input[type="number"], input[type="password"], select, textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 7px;
  padding: 8px 10px;
  font: inherit;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { min-height: 78px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }

button {
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 7px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #07121f; font-weight: 600; }
button.danger { color: var(--bad); }
button.ghost { background: none; }
button.sm { padding: 5px 10px; font-size: 12.5px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-family: var(--mono);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--muted);
  cursor: pointer;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-family: var(--mono); }
.pill.ok { background: rgba(70,192,138,0.15); color: var(--ok); }
.pill.warn { background: rgba(229,181,103,0.15); color: var(--warn); }
.pill.bad { background: rgba(229,115,107,0.15); color: var(--bad); }
.pill.idle { background: var(--panel-2); color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }

.banner {
  padding: 11px 14px;
  border-radius: 8px;
  margin-bottom: 14px;
  border: 1px solid;
  font-size: 13px;
}
.banner.err { background: rgba(229,115,107,0.1); border-color: rgba(229,115,107,0.35); color: #f3b3ae; }
.banner.ok { background: rgba(70,192,138,0.1); border-color: rgba(70,192,138,0.35); color: #9fe0c2; }
.banner.info { background: var(--accent-soft); border-color: rgba(91,157,255,0.35); color: #b9d4ff; }

.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }

.dropzone {
  border: 2px dashed var(--line);
  border-radius: 10px;
  padding: 32px;
  text-align: center;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }

.progress { height: 5px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }

/* ---------- review ---------- */

.review-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

.review-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.review-card.approved { border-color: var(--ok); }
.review-card.rejected { border-color: var(--bad); opacity: 0.6; }
.review-card img { width: 100%; display: block; aspect-ratio: 4/5; object-fit: cover; background: var(--panel-2); }
.review-card .meta { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.review-card .actions { display: flex; gap: 6px; padding: 0 12px 12px; }
.review-card .actions button { flex: 1; }

.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .n { font-size: 25px; font-weight: 620; letter-spacing: -0.02em; }
.stat .k { color: var(--muted); font-size: 12px; }

.gate { max-width: 420px; margin: 14vh auto; }

@media (max-width: 800px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; flex: none; height: auto; position: static; flex-direction: row; overflow-x: auto; }
  .main { padding: 18px; }
}
</style>
</head>
<body>
<div id="root"></div>
